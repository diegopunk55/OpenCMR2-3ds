name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86:
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - name: Install 32-bit build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y clang g++-multilib ninja-build glslang-tools pkg-config \
            libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 \
            libxi-dev:i386 libxss-dev:i386 libxtst-dev:i386 libxkbcommon-dev:i386 \
            libwayland-dev:i386 wayland-protocols libegl1-mesa-dev:i386 \
            libasound2-dev:i386 libudev-dev:i386 libdbus-1-dev:i386
      - uses: actions/checkout@v4
      # Ubuntu 24.04 has no SDL3 package: compile it for i386 too.
      - run: cmake --preset linux-x86 -DOPENCMR2_VENDORED_SDL=ON
      - run: cmake --build --preset linux-x86
      - run: ctest --preset linux-x86
      - name: Package
        run: |
          python3 tools/package_release.py --binary build/linux-x86/src/opencmr2 \
            --library build/linux-x86/src/libSDL3.so.0 \
            --license build/linux-x86/_deps/sdl3-src/LICENSE.txt \
            --output dist/OpenCMR2-Linux-i686.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCMR2-Linux-i686
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: CIA Builder launcher
        shell: cmd
        run: |
          cd tools\cia_builder
          call "CIA Builder.bat" which || exit /b 1
          call "CIA Builder.bat" check || exit /b 1
          rem Without Python on the PATH it must still be found (registry, folders).
          setlocal
          set "PATH=%SystemRoot%\system32;%SystemRoot%;%SystemRoot%\System32\Wbem"
          call "CIA Builder.bat" which
          endlocal
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: glslang
        shell: pwsh
        run: |
          curl.exe --fail --location --retry 3 --retry-delay 5 --output glslang.zip https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-main-windows-x86_64-release.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive glslang.zip -DestinationPath glslang
          & "$PWD\glslang\bin\glslang.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH "$PWD\glslang\bin"
      # clang++ from Visual Studio's LLVM component; SDL3 is fetched.
      - run: cmake --preset windows-x64 -DOPENCMR2_VENDORED_SDL=ON
      - run: cmake --build --preset windows-x64
      - run: ctest --preset windows-x64
      - name: Package
        shell: pwsh
        run: |
          python -m pip install pefile==2024.8.26
          $crt = Join-Path $env:VCToolsRedistDir "x64/Microsoft.VC143.CRT"
          python tools/package_release.py --binary build/windows-x64/src/opencmr2.exe `
            --dll-dir $crt --license build/windows-x64/_deps/sdl3-src/LICENSE.txt `
            --output dist/OpenCMR2-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCMR2-Windows-x64
          path: dist/*
          if-no-files-found: error

  # makerom for Windows, for the CIA Builder (tools/cia_builder), from the
  # same Project_CTR commit as the 3DS job's.
  makerom-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: git make mingw-w64-x86_64-gcc
      - name: makerom
        run: |
          git init -q /tmp/ctr && git -C /tmp/ctr fetch -q --depth 1 https://github.com/3DSGuy/Project_CTR d52c2b0e788c2d085763d7c5dcc4b2edd9ffb7d8
          git -C /tmp/ctr checkout -q FETCH_HEAD
          make -C /tmp/ctr/makerom deps -j4 && make -C /tmp/ctr/makerom program -j4
          mkdir -p dist
          cp /tmp/ctr/makerom/bin/makerom.exe dist/
          # The MinGW runtime DLLs it links, if any.
          for dll in $(objdump -p dist/makerom.exe | sed -n 's/.*DLL Name: //p'); do
            [ -f "/mingw64/bin/$dll" ] && cp "/mingw64/bin/$dll" dist/ || true
          done
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: makerom-windows
          path: dist/*
          if-no-files-found: error

  nintendo-3ds:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:latest
    needs: makerom-windows
    steps:
      - uses: actions/checkout@v4
      - name: makerom and bannertool
        run: |
          fetch() { git init -q "$1" && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; }
          fetch /tmp/ctr https://github.com/3DSGuy/Project_CTR d52c2b0e788c2d085763d7c5dcc4b2edd9ffb7d8
          make -C /tmp/ctr/makerom deps -j4 && make -C /tmp/ctr/makerom program -j4
          fetch /tmp/bannertool https://github.com/diasurgical/bannertool 16d8c5a0ce02a5e06e64ab42275132fca57c04a2
          git -C /tmp/bannertool submodule update --init --depth 1
          make -C /tmp/bannertool -j4
          mkdir -p /tmp/tools3ds
          cp /tmp/ctr/makerom/bin/makerom /tmp/bannertool/output/linux-x86_64/bannertool /tmp/tools3ds/
      - run: cmake --preset 3ds -DOPENCMR2_3DS_TOOLS=/tmp/tools3ds
      - run: cmake --build --preset 3ds
      - name: Package
        run: |
          mkdir -p dist/OpenCMR2-3DS
          cp build/3ds/src/OpenCMR2.cia build/3ds/src/opencmr2.3dsx dist/OpenCMR2-3DS/
          cp docs/3DS.md LICENSE dist/OpenCMR2-3DS/
          cd dist && zip -qr OpenCMR2-3DS.zip OpenCMR2-3DS && rm -r OpenCMR2-3DS
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCMR2-3DS
          path: dist/*
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: makerom-windows
          path: /tmp/makerom-windows
      - name: CIA Builder
        run: |
          # The PC tool that builds a standalone CIA with your game files (or an
          # SD card folder): tools/cia_builder, the game's ELF and the CIA's
          # banner, icon and settings, and makerom for Linux and Windows.
          kit=kit/OpenCMR2-CIA-Builder
          mkdir -p $kit/kit/bin/linux-x86_64 $kit/kit/bin/windows-x86_64
          cp tools/cia_builder/*.py tools/cia_builder/*.bat tools/cia_builder/README.md LICENSE $kit/
          cp build/3ds/src/opencmr2.elf res/3ds/opencmr2.rsf build/3ds/src/cia/icon.icn build/3ds/src/cia/banner.bnr $kit/kit/
          cp /tmp/tools3ds/makerom $kit/kit/bin/linux-x86_64/
          cp /tmp/makerom-windows/* $kit/kit/bin/windows-x86_64/
          echo "${GITHUB_SHA}" > $kit/kit/VERSION
          cd kit && zip -qr OpenCMR2-CIA-Builder.zip OpenCMR2-CIA-Builder
      - name: CIA Builder smoke test
        run: |
          # A fake installation through the real kit: the CIA must build.
          command -v python3 || { apt-get update -qq && apt-get install -y -qq python3; }
          fake=/tmp/fake-cmr2
          mkdir -p $fake/Game/Bigfiles $fake/FrontEnd $fake/Sounds $fake/Movies
          for f in Game/Bigfiles/common.bfl FrontEnd/common.bfl Sounds/surface.bfl Movies/intro.bik; do
            head -c 4096 /dev/urandom > $fake/$f
          done
          echo exe > $fake/CMR2.exe
          python3 kit/OpenCMR2-CIA-Builder/cia_builder.py --exe $fake/CMR2.exe --cia /tmp/smoke.cia
          test -s /tmp/smoke.cia
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCMR2-CIA-Builder
          path: kit/OpenCMR2-CIA-Builder.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86, windows, nintendo-3ds]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenCMR2-*
          path: dist
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
